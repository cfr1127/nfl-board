<style>
:root{--bg:#f7f7f5;--fg:#1b1b1b;--muted:#6b6b6b;--line:#dcdcd7;--accent:#0b57d0;--good:#0a7a3d;--bad:#a33;--tab:#ececea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:14px 18px 8px;border-bottom:1px solid var(--line);background:#fff}
h1{font-size:18px;margin:0 0 4px}
.head{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px}
.head b{color:var(--fg)}
nav{display:flex;gap:4px;padding:8px 18px 0;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border:1px solid var(--line);border-bottom:none;background:var(--tab);padding:7px 12px;border-radius:6px 6px 0 0;cursor:pointer;font:inherit}
nav button.on{background:var(--bg);font-weight:600}
section{display:none;padding:12px 18px}
section.on{display:block}
.caption{color:var(--muted);font-size:12.5px;margin:0 0 10px;max-width:1100px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.bar label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted)}
.bar select,.bar input{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;min-width:110px}
.bar select[multiple]{min-height:64px}
.count{color:var(--muted);font-size:12px;margin:0 0 6px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
th{position:sticky;top:0;background:#fafaf8;cursor:pointer;user-select:none;font-weight:600}
th.sorted::after{content:" ▾";color:var(--accent)}
th.sorted.asc::after{content:" ▴"}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pos{color:var(--good)} td.neg{color:var(--bad)}
tr.act td{background:#f1f8f3}
td.wrapcell{white-space:normal;min-width:260px;max-width:520px}
footer{padding:10px 18px 24px;color:var(--muted);font-size:12px}
@media (max-width:700px){section{padding:10px 8px}header,nav{padding-left:8px;padding-right:8px}}
</style></head>

const CAPTIONS = {"slate": "Venue, site (home / neutral / international) and kickoff-hour weather from Open-Meteo for outdoor stadiums -- 'dome' where the roof is closed, 'retractable roof' where it may open; display only, the model does not use it. Market total and spread are the ANCHOR, not a projection -- the simulation is solved to reproduce them; everything to their right is derived from that anchor. ref_home_spread and ref_total are the model's own unanchored numbers from the team ratings: reference only, never a bet. h1_edge_pts is the model's first-half mean minus the market's main first-half line.", "lines": "One row per priced selection, derivatives and props. edge_pp is model vs this book's own fair price; edge_vs_ref_pp is model vs the reference book; shop_edge_pp is the reference's fair probability vs the price you would take, vig included, no model involved. status and required_pp follow edge_pp. Green rows are actionable; 'why' says what disqualified the rest.", "main_lines": "Full-game spread, total and moneyline -- the model does NOT price these (measured against 3,689 closes and lost). One row per book and side at its main number. shop_edge_pp is pure line shopping against the reference book. model_line is the model's own unanchored number and model_pts is how many points the market's number is better for this side than the model's -- a second opinion to look at. Reference only, never a bet. Ratings-to-points fitted on 2014-2020 (1,871 games); on 2021-2023 the model&#x27;s spread missed the final by 10.42 points against the close&#x27;s 9.81, and where it disagreed with the close by 2+ points its side covered 50.3% of 537; total: 10.89 vs 10.46, disagreements 50.1% of 479.", "players": "Every player the simulation used, lined or not. *_line is the most common posted number across books; *_edge the best available edge on that stat; *_status whether it clears the model's measured error for that market and volume.", "health": "Capture health per market: quotes held, games covered, and how long since the last quote."};
const NUMERIC = new Set(['temp_f','wind_mph','gust_mph','precip_pct','line','odds','model_pct','market_pct','edge_pp','required_pp','ref_odds','ref_pct','edge_vs_ref_pp','shop_edge_pp','model_mean','quote_age_h','implied_pct','own_fair_pct','ref_line','model_line','model_pts','market_home_spread','market_total','ref_home_spread','ref_total','implied_home','implied_away','model_home','model_away','model_h1_total','market_h1_line','h1_edge_pts','prices','actionable','appearance_pct','pass_yards','pass_tds','rush_yards','receptions','rec_yards','anytime_td_pct','quotes','games','hours_since_last_quote']);
const SIGNED = new Set(['edge_pp','edge_vs_ref_pp','shop_edge_pp','model_pts','h1_edge_pts']);
const EDGECOL = {lines:'edge_pp', main_lines:'shop_edge_pp', players:null, slate:null, health:null};
const state = {};
function h(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(c,v){ if(v===null||v===undefined) return ''; if(typeof v==='number'){ return Number.isInteger(v)?String(v):v.toFixed(c.endsWith('_pp')||c.endsWith('_pts')?1:(Math.abs(v)<100?1:0)); } return String(v); }
function head(){
  const H=D.headline||{}; const el=document.getElementById('head');
  el.innerHTML = `<span>as of <b>${h(H.as_of||'')}</b> ET</span><span>games <b>${H.games??''}</b></span><span>priced selections <b>${H.selections??''}</b></span><span>actionable <b>${H.actionable??''}</b></span><span>disqualified <b>${H.disqualified??''}</b></span><span>stale markets <b>${h(H.stale_markets||'none')}</b></span><span>model <b>${h(H.model_version||'')}</b></span>`;
}
function build(){
  const nav=document.getElementById('nav'), main=document.getElementById('main');
  Object.keys(COLS).forEach((tab,i)=>{
    const b=document.createElement('button'); b.textContent=TITLES[tab]; b.onclick=()=>show(tab); b.id='tab-'+tab; nav.appendChild(b);
    const s=document.createElement('section'); s.id='sec-'+tab;
    const rows=D.tables[tab]||[];
    state[tab]={sort:SORT[tab][0], desc:SORT[tab][1], filters:{}, min:0, q:'', act:false, show:{}};
    let bar='';
    for(const grp of Object.keys(GROUPS[tab]||{})){
      let on=false; try{ on=localStorage.getItem('show:'+tab+':'+grp)==='1'; }catch(e){}
      state[tab].show[grp]=on;
      bar+=`<label>columns<span style="padding:5px 0"><input type="checkbox" data-tab="${tab}" data-group="${grp}" ${on?'checked':''}> ${grp}</span></label>`;
    }
    for(const f of FILT[tab]){
      const vals=[...new Set(rows.map(r=>r[f]).filter(v=>v!==null&&v!==undefined))].sort();
      bar+=`<label>${f}<select multiple data-tab="${tab}" data-col="${f}">${vals.map(v=>`<option value="${h(v)}">${h(v)}</option>`).join('')}</select></label>`;
    }
    if(EDGECOL[tab]) bar+=`<label>min |${EDGECOL[tab]}|<input type="number" step="0.5" value="0" data-tab="${tab}" data-min="1"></label>`;
    if(tab==='lines') bar+=`<label>status<span style="padding:5px 0"><input type="checkbox" data-tab="${tab}" data-act="1"> actionable only</span></label>`;
    bar+=`<label>search<input type="search" placeholder="any column" data-tab="${tab}" data-q="1"></label>`;
    s.innerHTML=`<p class="caption">${CAPTIONS[tab]||''}</p><div class="bar">${bar}</div><p class="count" id="count-${tab}"></p><div class="wrap"><table id="tbl-${tab}"></table></div>`;
    main.appendChild(s);
  });
  main.addEventListener('change',e=>{
    const t=e.target, tab=t.dataset.tab; if(!tab) return;
    if(t.dataset.col){ state[tab].filters[t.dataset.col]=[...t.selectedOptions].map(o=>o.value); }
    if(t.dataset.min) state[tab].min=parseFloat(t.value)||0;
    if(t.dataset.act) state[tab].act=t.checked;
    if(t.dataset.group){ state[tab].show[t.dataset.group]=t.checked; try{ localStorage.setItem('show:'+tab+':'+t.dataset.group, t.checked?'1':'0'); }catch(e){} }
    render(tab);
  });
  main.addEventListener('input',e=>{const t=e.target; if(t.dataset.q){state[t.dataset.tab].q=t.value.toLowerCase(); render(t.dataset.tab);}});
  main.addEventListener('click',e=>{
    const th=e.target.closest('th'); if(!th) return; const tab=th.dataset.tab, c=th.dataset.col; const st=state[tab];
    if(st.sort===c) st.desc=!st.desc; else {st.sort=c; st.desc=NUMERIC.has(c);} render(tab);
  });
  const first=(location.hash||'').slice(1); show(COLS[first]?first:'slate');
}
function show(tab){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+tab));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='sec-'+tab));
  history.replaceState(null,'','#'+tab); render(tab);
}
function render(tab){
  const st=state[tab]; let rows=D.tables[tab]||[]; const total=rows.length;
  const hidden=new Set(); for(const [grp,cs] of Object.entries(GROUPS[tab]||{})) if(!st.show[grp]) cs.forEach(c=>hidden.add(c));
  const cols=COLS[tab].filter(c=>!hidden.has(c));
  for(const [c,vals] of Object.entries(st.filters)) if(vals.length) rows=rows.filter(r=>vals.includes(String(r[c])));
  if(EDGECOL[tab]&&st.min>0) rows=rows.filter(r=>Math.abs(r[EDGECOL[tab]]??0)>=st.min);
  if(st.act) rows=rows.filter(r=>r.actionable===true||r.status==='actionable');
  if(st.q) rows=rows.filter(r=>cols.some(c=>String(r[c]??'').toLowerCase().includes(st.q)));
  const c=st.sort, desc=st.desc;
  // "Mon 09/14 8:15 PM EDT" sorts as a date, not as a string starting with M.
  const kick=v=>{const m=/(\d\d)\/(\d\d) (\d+):(\d\d) (AM|PM)/.exec(String(v||'')); if(!m) return null; let hr=+m[3]%12+(m[5]==='PM'?12:0); return (+m[1])*1e6+(+m[2])*1e4+hr*100+(+m[4]);};
  const key=c==='kickoff'?kick:(v=>v);
  rows=[...rows].sort((a,b)=>{const x=key(a[c]),y=key(b[c]); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; if(typeof x==='number'&&typeof y==='number') return desc?y-x:x-y; return desc?String(y).localeCompare(String(x)):String(x).localeCompare(String(y));});
  const cap=3000; const shown=rows.slice(0,cap);
  document.getElementById('count-'+tab).textContent=`${rows.length} of ${total} rows${rows.length>cap?` (showing first ${cap} — narrow the filters)`:''}`;
  const thead=`<thead><tr>${cols.map(k=>`<th data-tab="${tab}" data-col="${k}" class="${k===c?'sorted'+(desc?'':' asc'):''}">${k}</th>`).join('')}</tr></thead>`;
  const body=shown.map(r=>`<tr class="${r.actionable===true||r.status==='actionable'?'act':''}">${cols.map(k=>{const v=r[k]; let cls=NUMERIC.has(k)?'num':''; if(SIGNED.has(k)&&typeof v==='number'&&v!==0) cls+=v>0?' pos':' neg'; if(k==='why'||k==='note'||k==='reason_unpriced') cls+=' wrapcell'; return `<td class="${cls}">${h(fmt(k,v))}</td>`;}).join('')}</tr>`).join('');
  document.getElementById('tbl-'+tab).innerHTML=thead+'<tbody>'+body+'</tbody>';
}
head(); build();
</script>
</body></html>
